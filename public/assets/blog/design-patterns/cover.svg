<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="630" viewBox="0 0 1300 630" role="img" aria-label="Quando aplicar design patterns">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
  </defs>
  <rect width="1300" height="630" fill="url(#bg)"/>

  <!-- interlocking blocks motif -->
  <g transform="translate(1010,180)" fill="none" stroke-width="2">
    <rect x="0" y="0" width="90" height="90" rx="10" fill="#1e293b" stroke="#475569"/>
    <rect x="110" y="0" width="90" height="90" rx="10" fill="#1e293b" stroke="#475569"/>
    <rect x="55" y="110" width="90" height="90" rx="10" fill="#10b981" fill-opacity="0.18" stroke="#34d399"/>
    <rect x="0" y="220" width="90" height="90" rx="10" fill="#1e293b" stroke="#475569"/>
    <rect x="110" y="220" width="90" height="90" rx="10" fill="#1e293b" stroke="#475569"/>
    <line x1="45" y1="90" x2="100" y2="110" stroke="#334155"/>
    <line x1="155" y1="90" x2="100" y2="110" stroke="#334155"/>
    <line x1="100" y1="200" x2="45" y2="220" stroke="#334155"/>
    <line x1="100" y1="200" x2="155" y2="220" stroke="#334155"/>
  </g>

  <text x="80" y="150" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="24" fill="#34d399">&gt;_ undercoders</text>
  <text x="76" y="310" font-family="Inter, system-ui, sans-serif" font-size="60" font-weight="800" fill="#f8fafc">Quando aplicar</text>
  <text x="76" y="382" font-family="Inter, system-ui, sans-serif" font-size="60" font-weight="800" fill="#94a3b8">design patterns</text>
  <text x="80" y="500" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="22" fill="#64748b">padrão é resposta a um problema, não enfeite</text>
</svg>
