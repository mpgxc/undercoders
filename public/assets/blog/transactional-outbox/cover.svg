<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="630" viewBox="0 0 1300 630" role="img" aria-label="Transactional Outbox: o evento que nunca aconteceu">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <marker id="ar" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#475569"/>
    </marker>
    <marker id="ar-g" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L8,3.5 L0,7 Z" fill="#34d399"/>
    </marker>
  </defs>
  <rect width="1300" height="630" fill="url(#bg)"/>

  <!-- outbox flow motif -->
  <g transform="translate(1010,315)">
    <!-- transaction boundary -->
    <rect x="-150" y="-200" width="300" height="180" rx="14" fill="none"
          stroke="#334155" stroke-width="2" stroke-dasharray="7,6"/>
    <text x="-134" y="-208" font-family="'JetBrains Mono', ui-monospace, monospace"
          font-size="14" fill="#64748b">1 transação</text>

    <!-- state table -->
    <rect x="-120" y="-176" width="240" height="60" rx="10"
          fill="#10b981" fill-opacity="0.12" stroke="#34d399" stroke-width="2"/>
    <text x="0" y="-140" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace"
          font-size="19" font-weight="600" fill="#34d399">payments</text>

    <!-- outbox table -->
    <rect x="-120" y="-92" width="240" height="60" rx="10"
          fill="#10b981" fill-opacity="0.12" stroke="#34d399" stroke-width="2"/>
    <text x="0" y="-56" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace"
          font-size="19" font-weight="600" fill="#34d399">outbox</text>

    <!-- relay -->
    <rect x="-120" y="24" width="240" height="60" rx="10"
          fill="#0f766e" fill-opacity="0.18" stroke="#0d9488" stroke-width="2"/>
    <text x="0" y="60" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace"
          font-size="19" font-weight="600" fill="#5eead4">relay</text>

    <!-- broker -->
    <rect x="-120" y="140" width="240" height="60" rx="10"
          fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="0" y="176" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace"
          font-size="19" font-weight="600" fill="#94a3b8">broker</text>

    <!-- arrows -->
    <line x1="0" y1="-116" x2="0" y2="-96" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
    <line x1="0" y1="-20" x2="0" y2="20" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
    <line x1="0" y1="84" x2="0" y2="136" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>

    <!-- published feedback curve -->
    <path d="M 120 54 C 190 54 200 10 200 -30 C 200 -66 168 -62 120 -62"
          fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#ar-g)"/>
  </g>

  <text x="80" y="150" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="24" fill="#34d399">&gt;_ undercoders</text>
  <text x="76" y="300" font-family="Inter, system-ui, sans-serif" font-size="58" font-weight="800" fill="#f8fafc">O evento que</text>
  <text x="76" y="368" font-family="Inter, system-ui, sans-serif" font-size="58" font-weight="800" fill="#94a3b8">nunca aconteceu</text>
  <text x="80" y="440" font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="600" fill="#5eead4">Transactional Outbox</text>
  <text x="80" y="540" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="22" fill="#64748b">dual-write · relay · idempotência · inbox</text>
</svg>
