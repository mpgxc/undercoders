  <text x="76" y="436" font-family="Inter, system-ui, sans-serif" font-size="58" font-weight="800" fill="#94a3b8">de backend</text>
  <text x="80" y="540" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="22" fill="#64748b">Clean Architecture · DDD · Hexagonal · CQS · Saga</text>
